ы:clients,Товары:products,Спрос:()=>demand(f),Чаты:channels,Поставки:()=>supply(f),Расходы:()=>expenses(f),Поставщики:suppliers})[adminTab]()}</section></div>`}
function overview(f,os){let realized=os.filter(o=>o.status==='Выдан').reduce((n,o)=>n+amount(o),0);return `<div class="kpis">${kpi('Заявки (не отменены)',os.length)}${kpi('Прогноз выручки',rub(f.revenue))}${kpi('Прогноз результата',rub(f.profit))}${kpi('Маржа расчётная',f.revenue?(f.profit/f.revenue*100).toFixed(1)+'%':'—')}${kpi('Получено оплат',rub(f.paid))}${kpi('Выдано на сумму',rub(realized))}${kpi('Вес продукции',f.weight.toFixed(2)+' кг')}${kpi('Средняя заявка',rub(os.length?f.revenue/os.length:0))}</div><div class="two"><div class="panel"><h3>Спрос по товарам, шт.</h3>${bars([...f.a].sort((a,b)=>b.q-a.q),'q')}</div><div class="panel"><h3>Расходы партии, ₽</h3>${bars([{name:'Закупка',v:f.buy},{name:'Доставка',v:f.freight},{name:'Закупщик',v:f.commission},{name:'Общие',v:f.fixed},{name:'Дополнительные',v:f.other}],'v',v=>Math.round(v).toLocaleString('ru-RU'))}</div></div><div class="panel" style="margin-top:12px"><h3>Динамика заявок, 7 дней</h3>${bars(Array.from({length:7},(_,i)=>{let d=new Date(Date.parse(todayISO()+'T00:00:00Z')-(6-i)*86400000);return{name:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',timeZone:zone}),v:os.filter(o=>dateText(o.date)===dateText(d)).length}}),'v')}</div>`}
function adminOrders(){let os=selectedOrders().filter(o=>selectedStatus==='Все'||o.status===selectedStatus).slice().reverse();return `<div class="panel"><div class="field"><label>Статус</label><select onchange="selectedStatus=this.value;render()">${opts(['Все',...statuses],selectedStatus)}</select></div>${table(['Заявка / дата','Клиент','Источник / город','Состав','Сумма','Статус','Оплата ₽'],os.map(o=>[esc(o.id.slice(0,8))+'<br>'+esc(dateText(o.date))+'<br>Партия '+esc(o.batch),esc(o.name)+'<br>'+esc(o.contact),esc(o.source)+'<br>'+esc(o.city),o.items.map(p=>esc(p.name)+' × '+p.q).join('<br>')+(o.wish?'<br>Запрос: '+esc(o.wish):''),rub(amount(o)),`<select aria-label="Статус" onchange="orderEdit('${o.id}','status',this.value)">${opts(statuses,o.status)}</select>`,`<input type="number" min="0" aria-label="Получено" value="${num(o.paid)}" onchange="orderEdit('${o.id}','paid',this.value)">`]))}</div>`}function orderEdit(k,field,v){let o=db.orders.find(o=>o.id===k);if(o){if(field==='status'&&o.status==='Отменён'&&v!=='Отменён'){let b=findBatch(o.batch);if(!b||b.stage!=='Сбор заявок'||used(b)+orderGrams(o)>capacity(b))return toast('Нельзя восстановить заявку: партия закрыта или нет места');}o[field]=field==='paid'?num(v):v;advanceIfFull();save();render()}}function clients(){let m={};for(let o of filtered()){let k=o.contact.toLowerCase().trim();if(!m[k])m[k]={name:o.name,contact:o.contact,city:o.city,source:o.source,n:0,total:0,paid:0};m[k].n++;m[k].total+=amount(o);m[k].paid+=num(o.paid)}return `<div class="panel"><h3>Клиентская база · ${Object.keys(m).length}</h3>${table(['Имя','Контакт','Город','Источник','Заявки','Потенциал','Оплата'],Object.values(m).map(x=>[esc(x.name),esc(x.contact),esc(x.city),esc(x.source),x.n,rub(x.total),rub(x.paid)]))}</div>`}
function productEdit(k,field,v){let p=prod(k);if(p){p[field]=['buy','price','net','gross'].includes(field)?num(v):field==='active'?v==='true':v;if(!p.active)delete db.cart[k];save();render()}}function products(){return `<div class="panel"><h3>Управление каталогом</h3><p class="tiny">Изменение цены не меняет ранее сохранённые заявки.</p>${table(['Товар','Категория','Вес нетто, г','Вес брутто, г','Закупка ₽','Продажа ₽','Показ'],db.products.map(p=>[`<input aria-label="Название" value="${esc(p.name)}" onchange="productEdit('${p.id}','name',this.value)">`,`<select onchange="productEdit('${p.id}','cat',this.value)">${opts(cats,p.cat)}</select>`,...['net','gross','buy','price'].map(k=>`<input type="number" min="0" aria-label="${k}" value="${p[k]}" onchange="productEdit('${p.id}','${k}',this.value)">`),`<select onchange="productEdit('${p.id}','active',this.value)"><option value="true" ${p.active?'selected':''}>Да</option><option value="false" ${!p.active?'selected':''}>Нет</option></select>`]))}<button onclick="addProduct()" style="margin-top:12px">+ Добавить товар</button></div>`}function addProduct(){db.products.push({id:id(),name:'Новый товар',cat:cats[0],net:100,gross:120,buy:0,price:0,shape:'jar',active:false,cold:false});save();render()}
function demand(f){let rows=[...f.a].sort((a,b)=>b.q-a.q),groups={};for(let p of rows){groups[p.cat]=(groups[p.cat]||0)+p.q}return `<div class="two"><div class="panel"><h3>Спрос по SKU</h3>${bars(rows,'q')}</div><div class="panel"><h3>Категории, шт.</h3>${bars(Object.entries(groups).map(([name,q])=>({name,q})),'q')}</div></div><div class="panel" style="margin-top:12px"><h3>Экономика товаров</h3>${table(['Товар','Спрос','Выручка','Вес','Результат*','На кг*'],rows.map(p=>{let cost=p.buyTotal*(1+db.settings.commission/100)+p.weight*db.settings.freight+(f.weight?(f.fixed+f.other)*p.weight/f.weight:0),profit=p.revenue-cost;return[esc(p.name),p.q,rub(p.revenue),p.weight.toFixed(2),rub(profit),rub(p.weight?profit/p.weight:0)]}))}<p class="tiny">*Прогноз с распределением общих расходов по весу. Не подтверждённая прибыль.</p></div><div class="panel" style="margin-top:12px"><h3>Индивидуальные запросы</h3>${table(['Дата','Запрос','Город','Источник'],filtered().filter(o=>o.wish).map(o=>[esc(dateText(o.date)),esc(o.wish),esc(o.city),esc(o.source)]))}</div>`}
function channels(){let os=selectedOrders(),vs=db.visits.filter(v=>selectedPeriod==='Все'||Date.now()-Date.parse(v.date)<=Number(selectedPeriod)*86400000);let rows=db.sourceNames.filter(n=>selectedSource==='Все'||n===selectedSource).map(name=>{let orders=os.filter(o=>o.source===name),valid=orders.filter(o=>o.status!=='Отменён'),visits=vs.filter(v=>v.source===name).length;return{name,visits,orders:orders.length,paid:valid.filter(o=>o.paid>0).length,revenue:valid.reduce((n,o)=>n+amount(o),0)}});return `<div class="panel"><h3>Статистика источников</h3>${table(['Чат / источник','Локальные визиты','Заявки','С оплатой','Заявок / визит*','Потенциал'],rows.map(r=>[esc(r.name),r.visits,r.orders,r.paid,r.visits?(r.orders/r.visits*100).toFixed(1)+'%':'—',rub(r.revenue)]))}<p class="tiny">*В локальной демо-версии это отношение заявок к сессиям, не уникальная конверсия. Демоданные и реальные тестовые сессии не представляют рынок.</p></div><div class="panel" style="margin-top:12px"><h3>Ссылки для рекламных публикаций</h3>${Object.entries(srcMap).map(([k,v])=>`<div class="line"><span>${esc(v)}</span><button onclick="copySource('${k}')">Копировать ?src=${k}</button></div>`).join('')}<p class="tiny">При публикации сайта замените локальный адрес на публичный HTTPS. Для Telegram затем используем startapp.</p></div>`}async function copySource(k){let u=new URL(location.href);u.hash='catalog';u.search='?src='+k;try{await navigator.clipboard.writeText(u.href);toast('Ссылка скопирована')}catch{prompt('Скопируйте ссылку',u.href)}}
function oldSupply(f){let a=aggregate(filtered().filter(o=>o.batch===db.settings.batch));return `<div class="panel"><h3>Активная партия</h3><div class="two"><div class="field"><label>Номер партии</label><input value="${esc(db.settings.batch)}" onchange="setSetting('batch',this.value)"></div><div class="field"><label>Состояние</label><select onchange="setSetting('stage',this.value)">${opts(batches,db.settings.stage)}</select></div></div><div class="kpis">${kpi('Вес в выбранной партии',a.reduce((s,p)=>s+p.weight,0).toFixed(2)+' кг')}${kpi('Собрано оплат, выборка',rub(f.paid))}${kpi('Расчёт затрат, выборка',rub(f.cost))}${kpi('Разрыв, выборка',rub(Math.max(0,f.cost-f.paid)))}</div><h3>Ведомость закупки · подтверждённые заявки</h3>${table(['Товар','Шт.','Вес кг','Закупка'],aggregate(filtered().filter(o=>o.batch===db.settings.batch&&statuses.slice(1,6).includes(o.status))).map(p=>[esc(p.name),p.q,p.weight.toFixed(2),rub(p.buyTotal)]))}<p class="tiny">Статус партии и статусы заявок изменяются отдельно. Для новых заявок используется активный номер.</p></div>`}
function expenses(f){return `<div class="panel"><h3>Параметры расчёта</h3><div class="two">${[['rate','LKR за рубль'],['freight','Доставка ₽/кг'],['commission','Закупщик %'],['packing','Упаковка, ₽ на расчёт'],['extra','Резерв прочих затрат, ₽']].map(([k,t])=>`<div class="field"><label>${t}</label><input type="number" min="0" step="any" value="${db.settings[k]}" onchange="setSetting('${k}',this.value)"></div>`).join('')}</div><p class="tiny">Модельные параметры, не тарифы. Общие затраты применяются один раз ко всей выбранной выборке; это не бухгалтерский P&L.</p><div class="line"><b>Расчёт затрат</b><strong>${rub(f.cost)}</strong></div></div><form class="panel" style="margin-top:12px" onsubmit="addExpense(event)"><h3>Дополнительный фактический расход</h3><div class="two"><input id="expenseName" required placeholder="Описание расхода"><input id="expenseAmount" type="number" min="0" step="any" required placeholder="Сумма ₽"></div><button style="margin-top:10px">Добавить расход</button>${table(['Дата','Описание','Сумма',''],db.expenses.map(e=>[esc(new Date(e.date).toLocaleDateString('ru-RU')),esc(e.name),rub(e.amount),`<button type="button" onclick="removeExpense('${e.id}')">Удалить</button>`]))}</form>`}function addExpense(e){e.preventDefault();db.expenses.push({id:id(),name:$('expenseName').value,amount:num($('expenseAmount').value),date:new Date().toISOString()});save();render()}function removeExpense(k){db.expenses=db.expenses.filter(e=>e.id!==k);save();render()}
function suppliers(){return `<form class="panel" onsubmit="addSupplier(event)"><h3>Поставщики и перевозчики</h3><div class="two"><input required id="supplierName" placeholder="Название"><input id="supplierContact" placeholder="Контакты"><select id="supplierType">${opts(['Закупка','Перевозка'],'Закупка')}</select><input id="supplierTerms" placeholder="Тариф, условия, примечание"></div><button style="margin-top:12px">Добавить</button>${table(['Название','Контакт','Тип','Условия'],db.suppliers.map(s=>[esc(s.name),esc(s.contact),esc(s.type),esc(s.terms)]))}</form>`}function addSupplier(e){e.preventDefault();db.suppliers.push({name:$('supplierName').value,contact:$('supplierContact').value,type:$('supplierType').value,terms:$('supplierTerms').value});save();render()}
function oldToggleDemo(){if(db.settings.demo){db.orders=db.orders.filter(o=>!o.demo);db.visits=db.visits.filter(v=>!v.demo);db.settings.demo=false}else{for(let i=0;i<18;i++){let p=seedProducts[i%10],p2=seedProducts[(i+3)%10],src=db.sourceNames[1+i%7],date=new Date(Date.now()-(i%7)*86400000).toISOString();db.orders.push({id:'demo-'+id(),date,source:src,city:src,name:'Тестовый клиент '+(i%12+1),contact:'@demo'+(i%12+1),wish:i%5===0?'Хочу заказать сушёные грибы':'',items:[p,p2].map((x,j)=>({id:x.id,name:x.name,cat:x.cat,q:1+(i+j)%3,buy:x.buy,price:x.price,gross:x.gross})),status:statuses[i%6],paid:i%6>=2?1000:0,batch:db.settings.batch,demo:true});for(let j=0;j<5;j++)db.visits.push({source:src,date,demo:true})}db.settings.demo=true}save();render()}
function exportData(){let cells=[['id','date','source','city','name','contact','status','batch','product','quantity','unit_price_rub','order_paid_rub','demo','wish']];for(let o of selectedOrders())for(let [i,p] of (o.items.length?o.items:[{name:'',q:0,price:0}]).entries())cells.push([o.id,o.date,o.source,o.city,o.name,o.contact,o.status,o.batch,p.name,p.q,p.price,i===0?o.paid:'',o.demo,i===0?o.wish:'']);let csv='\ufeff'+cells.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='samobranka-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

const zone='Asia/Colombo';
const dateText=d=>d?new Date(d).toLocaleDateString('ru-RU',{timeZone:zone,day:'numeric',month:'short',year:'numeric'}):'Не назначено';
const dateOnly=d=>d?d.split('-').reverse().join('.'):'Не назначено';
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function newBatch(id,limit=30000,pack=1000){return {id,limit,pack,stage:'Сбор заявок',created:new Date().toISOString(),closed:null,track:'',sent:'',etaFrom:'',etaTo:'',events:[],carrier:'EMS / Почта России'}}
db.parcels??=[newBatch('001')];db.settings.batch=db.parcels.find(b=>b.stage==='Сбор заявок')?.id||'001';
const findBatch=k=>db.parcels.find(b=>b.id===k), capacity=b=>Math.max(0,b.limit-b.pack), orderGrams=o=>o.items.reduce((s,p)=>s+Math.round(p.gross)*p.q,0), used=b=>db.orders.filter(o=>o.batch===b.id&&o.status!=='Отменён').reduce((s,o)=>s+orderGrams(o),0), free=b=>Math.max(0,capacity(b)-used(b)), cartGrams=()=>cartRows().reduce((s,{p,q})=>s+Math.round(p.gross)*q,0), kg=g=>(g/1000).toLocaleString('ru-RU',{maximumFractionDigits:3})+' кг';
const minSKU=()=>Math.min(...active().filter(p=>!p.cold&&p.gross>0).map(p=>Math.round(p.gross)));
function openNext(b){if(b.stage==='Сбор заявок'){b.stage='Согласование цен';b.closed=new Date().toISOString()}let next=db.parcels.find(x=>x.stage==='Сбор заявок');if(!next){let n=Math.max(0,...db.parcels.map(x=>Number(x.id)||0))+1;next=newBatch(String(n).padStart(3,'0'),b.limit,b.pack);db.parcels.push(next)}db.settings.batch=next.id;return next}
function currentBatch(){return db.parcels.find(x=>x.stage==='Сбор заявок')||openNext(db.parcels[db.parcels.length-1])}
function advanceIfFull(){let b=currentBatch();if(free(b)===0|| (Number.isFinite(minSKU())&&free(b)<minSKU()))openNext(b);save()}
function assignBatch(o){let b=currentBatch(),g=orderGrams(o);if(o.items.some(p=>p.gross<=0||!Number.isSafeInteger(p.q)||p.q<1)){toast('Некорректный вес или количество. Уточните товар.');return false}if(g>capacity(b)){toast('Корзина превышает лимит одной партии. Уменьшите количество.');return false}if(g>free(b)){if(!window.confirm('В текущей партии недостаточно места. Закрыть её и перенести весь заказ в следующую?'))return false;b=openNext(b)}o.batch=b.id;return true}
function meter(b){let u=used(b),c=capacity(b);return `<div class="capacity" role="progressbar" aria-label="Заполнение партии" aria-valuenow="${Math.round(u/Math.max(1,c)*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,u/Math.max(1,c)*100)}%"></i></div><div class="batch-nums"><span><strong>${kg(u)}</strong> из ${kg(c)}</span><span>Свободно: <strong>${kg(free(b))}</strong></span></div>`}
function batchBanner(){let b=currentBatch();return `<section class="batch-banner"><div><div class="eyebrow">Открыт сбор · Партия №${esc(b.id)}</div><h3>Москва → Хиккадува</h3><p class="tiny">Предварительный резерв. Отправка после согласования.</p></div><div>${meter(b)}<div class="date-note">Лимит с упаковкой ${kg(b.limit)} · резерв ${kg(b.pack)}</div></div></section>`}

function trackingPanel(b,adminMode){if(!b)return '<p class="tiny">Партия ещё не привязана.</p>';let carrier=b.carrierHistory?.barcode===b.track?b.carrierHistory:null;let events=[...(b.events||[]),...(carrier?.events||[])].sort((a,z)=>z.date.localeCompare(a.date));let latest=carrier?.events?.[0]||events[0];let elapsed=b.sent?Math.max(0,Math.floor((Date.parse(todayISO()+'T00:00:00Z')-Date.parse(b.sent+'T00:00:00Z'))/86400000)):null;return `<div class="trackcard"><div class="line"><h3>Партия №${esc(b.id)}</h3><span class="tag">${esc(b.stage)}</span></div><p class="tiny">Перевозчик: ${esc(b.carrier)} · ${carrier?(carrier.stale?'последние сохранённые данные EMS (обновление недоступно)':'данные EMS на '+esc(dateText(carrier.checked_at))):'ручные данные; синхронизации пока нет'}</p><div class="two"><div><div class="muted tiny">Отправление</div><strong>${dateOnly(b.sent)}</strong></div><div><div class="muted tiny">В пути</div><strong>${elapsed===null?'Не отправлено':elapsed+' дн. с отправки'}</strong></div><div><div class="muted tiny">Ожидаемое прибытие (прогноз)</div><strong>${b.etaFrom&&b.etaTo?dateOnly(b.etaFrom)+' — '+dateOnly(b.etaTo):'Пока неизвестно'}</strong></div><div><div class="muted tiny">Последнее место / событие</div><strong>${latest?esc(latest.place||latest.kind):'Нет данных'}</strong></div></div>${b.track?`<a class="tracklink" href="https://www.pochta.ru/tracking?barcode=${encodeURIComponent(b.track)}" target="_blank" rel="noopener noreferrer">${esc(b.track)} · Проверить на Почте России ↗</a><div style="margin:10px 0"><button type="button" onclick="refreshTracking('${esc(b.id)}')">Обновить EMS</button></div>`:'<p class="tiny">Трек-номер появится после отправки.</p>'}${events.length?`<ol class="timeline">${events.map(e=>`<li><strong>${esc(e.kind)}</strong><small>${esc(e.date.includes('T')?e.date.replace('T',' '):dateOnly(e.date))} · ${esc(e.place||'Место не указано')} · ${e.source==='russian_post'?'EMS / Почта России':'внесено вручную'}</small></li>`).join('')}</ol>`:''}${adminMode?`<form onsubmit="saveTracking(event,'${b.id}')"><div class="two"><div class="field"><label for="tr">Трек-номер EMS</label><input id="tr" value="${esc(b.track)}" placeholder="13 символов"></div><div class="field"><label for="sent">Фактическая дата отправки</label><input id="sent" type="date" max="${todayISO()}" value="${esc(b.sent)}"></div><div class="field"><label for="etaFrom">Прибытие от (прогноз)</label><input id="etaFrom" type="date" value="${esc(b.etaFrom)}"></div><div class="field"><label for="etaTo">Прибытие до (прогноз)</label><input id="etaTo" type="date" value="${esc(b.etaTo)}"></div></div><button>Сохранить трекинг</button></form><form onsubmit="addEvent(event,'${b.id}')" style="margin-top:16px"><h3>Добавить событие вручную</h3><div class="two"><div class="field"><label for="eventDate">Дата операции</label><input required id="eventDate" type="date" max="${todayISO()}" value="${todayISO()}"></div><div class="field"><label for="eventKind">Событие</label><select id="eventKind">${opts(eventKinds,eventKinds[0])}</select></div><div class="field"><label for="eventPlace">Место по данным перевозчика</label><input id="eventPlace" placeholder="Например, сортировочный центр"></div></div><button>Добавить событие</button></form>`:''}</div>`}
const trackingPending=new Set();
async function refreshTracking(k,quiet=false){
  let b=findBatch(k), track=b?.track;
  if(!track||trackingPending.has(track))return;
  if(location.protocol==='file:'||!['localhost','127.0.0.1'].includes(location.hostname)){if(!quiet)toast('API EMS пока не подключён. Используйте официальный трекинг.');return}
  trackingPending.add(track);
  try{
    const response=await fetch('/api/tracking?barcode='+encodeURIComponent(track),{cache:'no-store'});
    if(!response.ok)throw new Error('Tracking unavailable');
    const data=await response.json();
    if(data.barcode!==track||!Array.isArray(data.events)||typeof data.checked_at!=='string')throw new Error('Invalid data');
    for(const parcel of db.parcels.filter(x=>x.track===track))parcel.carrierHistory=data;
    save();
    // Avoid discarding unsaved admin fields during periodic refresh.
    if(!quiet||page==='orders')render();
    if(!quiet)toast(data.stale?'Показаны последние сохранённые события':'Трекинг обновлён');
  }catch(e){if(b?.carrierHistory?.barcode===track){b.carrierHistory.stale=true;save();if(!quiet||page==='orders')render()}if(!quiet)toast('EMS недоступен. Проверьте настройки сервера или официальный трекинг.')}
  finally{trackingPending.delete(track)}
}

function saveTracking(e,k){e.preventDefault();let b=findBatch(k),t=$('tr').value.trim().toUpperCase(),sent=$('sent').value,from=$('etaFrom').value,to=$('etaTo').value;if(t&&!/^[A-Z]{2}\d{9}[A-Z]{2}$/.test(t))return toast('Проверьте формат международного трек-номера');if(sent>todayISO()||(from&&!to)||(!from&&to)||(from&&to&&(from>to||(sent&&from<sent))))return toast('Проверьте порядок дат и диапазон прогноза');if(b.track!==t){b.carrierHistory=null;b.events=[]}Object.assign(b,{track:t,sent,etaFrom:from,etaTo:to});save();render();toast('Трекинг сохранён локально')}
function addEvent(e,k){e.preventDefault();let b=findBatch(k),d=$('eventDate').value;if(!d||d>todayISO()||(b.sent&&d<b.sent))return toast('Проверьте дату события');b.events.push({date:d,kind:$('eventKind').value,place:$('eventPlace').value.trim()});save();render()}
function setLimits(e,k){e.preventDefault();let b=findBatch(k),l=Math.round(Number($('limit').value)*1000),p=Math.round(Number($('pack').value)*1000);if(!Number.isFinite(l)||!Number.isFinite(p)||l<=0||p<0||p>=l||l-p<used(b)||(Number.isFinite(minSKU())&&l-p<minSKU()))return toast('Лимит должен покрывать уже зарезервированный вес и упаковку');b.limit=l;b.pack=p;advanceIfFull();save();render()}

function toggleDemo(){if(db.settings.demo){db.orders=db.orders.filter(o=>!o.demo);db.visits=db.visits.filter(v=>!v.demo);db.parcels=db.parcels.filter(b=>!b.demo);db.settings.demo=false}else{let prev=db.settings.batch;oldToggleDemo();let n=Math.max(...db.parcels.map(b=>Number(b.id)||0))+1;let b=newBatch(String(n).padStart(3,'0'));b.stage='В пути';b.demo=true;db.parcels.push(b);for(let o of db.orders.filter(o=>o.demo))o.batch=b.id;let w=used(b);if(w>capacity(b)){b.limit=w+b.pack}db.settings.batch=prev;db.settings.demo=true}save();render()}

const reduceMotion=()=>window.matchMedia?.('(prefers-reduced-motion: reduce)').matches===true;
let lastRenderedPage=null,lastCartCount=cartCount(),animeLoading=false,animeAttempted=false;
function ornamentMotion(){
 if(reduceMotion()||page!=='home')return;
 const ring=document.querySelector('.hero-plate .plate-ring');if(!ring)return;
 if(window.anime?.animate){try{window.anime.animate(ring,{rotate:[-8,0],duration:480,ease:'outQuad'})}catch{}return}
 if(animeLoading||animeAttempted||location.protocol==='file:')return;
 animeLoading=true;animeAttempted=true;
 const script=document.createElement('script');
 script.src='./vendor/anime-4.5.0.min.js';script.async=true;
 script.onload=()=>{animeLoading=false;ornamentMotion()};
 script.onerror=()=>{animeLoading=false};document.head.appendChild(script);
}
const baseRender=render;
render=function(){
 const routeChanged=lastRenderedPage!==page,prev=lastCartCount;
 baseRender();
 const root=$('app');root.classList.remove('page-enter');
 if(routeChanged&&!reduceMotion()){void root.offsetWidth;root.classList.add('page-enter');ornamentMotion()}
 const n=cartCount(),top=$('cartTop');if(n>prev&&!reduceMotion()){top.classList.remove('cart-pulse');void top.offsetWidth;top.classList.add('cart-pulse')}
 lastRenderedPage=page;lastCartCount=n;
 $('nav').innerHTML=[['home','Главная'],['catalog','Каталог'],['delivery','Посылки'],['orders','Мои заявки'],['about','Помощь']].map(([p,t])=>'<button onclick="go(\''+p+'\')" '+(page===p?'aria-current="page"':'')+'>'+t+'</button>').join('');

 document.title=({'home':'Русские продукты на Шри-Ланке','catalog':'Каталог','cart':'Корзина','orders':'Мои заявки','delivery':'Посылки','about':'Как заказать','admin':'Демо CRM'}[page]||'Магазин')+' — Самобранка';
};

page=location.hash.slice(1)||'home';if(!['home','catalog','cart','orders','about','admin','delivery'].includes(page))page='home';render();refreshVisibleTracking();
