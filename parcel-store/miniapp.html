<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Самобранка — Telegram</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--ink:#193251;--blue:#234e91;--soft:#edf2fa;--bg:#f8f7f3;--line:#dce3ed}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.5 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:2}header b{font:700 26px Georgia,serif;color:var(--blue)}header small{display:block;color:#58697c}main{max-width:960px;margin:auto;padding:16px 14px 100px}h1,h2,h3,p{margin:0 0 10px}h1{font:normal 34px/1.1 Georgia,serif}h2{font-size:22px}h3{font-size:15px}p,small{color:#58697c}.hero,.panel,.card{border:1px solid var(--line);border-radius:14px;background:white;padding:15px}.hero{background:var(--soft);margin-bottom:12px}.hero svg{float:right;width:66px;height:66px;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.card{display:flex;flex-direction:column;gap:6px;min-width:0}.card h3{margin:0}.card .art{height:80px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--blue);font-size:12px;text-align:center}.card .qty{margin-top:auto}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:9px;min-height:44px;background:white;color:var(--blue);font-weight:650;padding:8px 12px;cursor:pointer}button.primary{background:var(--blue);color:white}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b69a64;outline-offset:2px}.qty{display:flex;align-items:center;justify-content:space-between;gap:5px}.qty button{min-width:44px}.filters{display:flex;gap:6px;overflow:auto;margin:12px 0}.filters button{white-space:nowrap}.filters .active{background:var(--soft);border-color:var(--blue)}nav{position:fixed;bottom:0;left:0;right:0;z-index:3;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom));gap:4px}nav button{flex:1;max-width:180px;border:none;font-size:12px}nav button[aria-current=page]{background:var(--soft)}input:not([type=checkbox]),textarea{width:100%;background:white;border:1px solid var(--line);padding:11px;border-radius:9px;margin:6px 0;min-height:44px}.notice{background:#f5eee0;padding:12px;border-radius:9px;font-size:13px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.meter{height:9px;background:#e4eaf4;border-radius:10px;overflow:hidden}.meter i{display:block;background:var(--blue);height:100%}.card .price{font-weight:700}#feedback{position:sticky;top:75px;z-index:2;background:#f5eee0;padding:10px;border-radius:9px;margin-bottom:8px}#feedback:empty{display:none}.section{animation:enter .18s ease-out both}@keyframes enter{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:9px}}
</style></head><body><header><b>Самобранка</b><small>Русские продукты · Хиккадува</small></header><main><div id="feedback" role="status" aria-live="polite"></div><div id="app">Загрузка каталога…</div></main><nav id="nav" aria-label="Разделы"></nav><script>
'use strict';
const tg=window.Telegram?.WebApp, auth=tg?.initData||'';
try{tg?.ready();tg?.expand();tg?.setHeaderColor('#f8f7f3');tg?.setBackgroundColor('#f8f7f3')}catch{}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null,cart={},page='catalog',category='Все',query='',wish='',notify=false,allowNext=false,pending=false,requestId=null,history=[],admin=null;
const rub=n=>(n/100).toLocaleString('ru-RU',{style:'currency',currency:'RUB'});
const feedback=s=>$('feedback').textContent=s;
async function api(path,body){let headers={'X-Telegram-Init-Data':auth};if(body)headers['Content-Type']='application/json';const r=await fetch(path,{headers,method:body?'POST':'GET',body:body?JSON.stringify(body):undefined,cache:'no-store'});let j=await r.json();if(!r.ok){let e=new Error(j.error||'Сервис недоступен');e.status=r.status;throw e}return j}
const items=()=>Object.entries(cart).map(([sku,q])=>[data.products.find(p=>p.id===sku),q]).filter(([p])=>p);
const resetKey=()=>{requestId=null};
function change(id,n){if(pending)return;cart[id]=Math.min(99,Math.max(0,(cart[id]||0)+n));if(!cart[id])delete cart[id];resetKey();render()}
function qty(p){return '<div class="qty"><button aria-label="Уменьшить" onclick="change(\''+p.id+'\',-1)">−</button><b>'+(cart[p.id]||0)+'</b><button aria-label="Добавить" onclick="change(\''+p.id+'\',1)">+</button></div>'}
function parcel(){const p=data.parcel;return '<div class="panel"><small>Партия №'+p.id+' · резерв товаров</small><h3>Свободно '+((p.capacity-p.reserved)/1000).toFixed(2)+' кг</h3><div class="meter" role="progressbar" aria-label="Заполнение партии" aria-valuenow="'+Math.round(p.reserved/p.capacity*100)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p.reserved/p.capacity*100+'%"></i></div><small>'+p.reserved/1000+' из '+p.capacity/1000+' кг</small></div>'}
function catalog(){const cats=['Все',...new Set(data.products.map(p=>p.category))];return '<section class="hero"><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="40" cy="40" r="36"/><circle cx="40" cy="40" r="30"/><path d="M20 45h40M25 42a15 15 0 0 1 30 0M40 26v-5M25 48q15 12 30 0"/></svg><h1>Всё, по чему<br>скучали.</h1><p>Предзаказы из России, без оплаты сейчас.</p></section>'+parcel()+'<div class="notice">'+(data.accepting?'Заявка не является оплатой. Неподтверждённые позиции собираем как интерес.':'Пилот: приём реальных заявок ещё выключен.')+'</div><input aria-label="Поиск" placeholder="Найти продукт" value="'+esc(query)+'" oninput="query=this.value;drawProducts()"><div class="filters">'+cats.map((c,i)=>'<button class="'+(category===c?'active':'')+'" onclick="selectCat('+i+')">'+esc(c)+'</button>').join('')+'</div><div class="grid" id="products"></div>'}
function selectCat(i){category=['Все',...new Set(data.products.map(p=>p.category))][i];render()}
function drawProducts(){const root=$('products');if(!root)return;const ps=data.products.filter(p=>(category==='Все'||p.category===category)&&(p.name+' '+p.size).toLowerCase().includes(query.toLowerCase()));root.innerHTML=ps.map(p=>'<article class="card"><div class="art">Фото после<br>подтверждения SKU</div><small>'+esc(p.category)+'</small><h3>'+esc(p.name)+'</h3><small>'+esc(p.size)+'</small><div class="price">'+(p.approved?rub(p.price_kopecks):'Цена уточняется')+'</div><small>'+(p.approved?'Предзаказ':'Сбор интереса')+'</small>'+qty(p)+'</article>').join('')||'<p>Ничего не найдено.</p>'}
function checkout(){const rows=items();return '<h2>Ваша заявка</h2><div class="panel">'+(rows.map(([p,q])=>'<div class="row"><div>'+esc(p.name)+'<br><small>'+(p.approved?rub(p.price_kopecks*q):'Запрос без резерва')+'</small></div>'+qty(p)+'</div>').join('')||'<p>Корзина пуста.</p>')+'<p style="margin-top:12px">Подтверждённые позиции: <b>'+rub(rows.reduce((s,[p,q])=>s+(p.approved?p.price_kopecks*q:0),0))+'</b></p><label>Что ещё привезти?<textarea maxlength="1000" rows="3" oninput="wish=this.value;resetKey()">'+esc(wish)+'</textarea></label><label><input type="checkbox" '+(allowNext?'checked':'')+' onchange="allowNext=this.checked"> Согласен на следующую партию, если не поместится</label><br><label><input type="checkbox" '+(notify?'checked':'')+' onchange="notify=this.checked;resetKey()"> Хочу новости о поставках</label><p><small>Для заявки сохраняется ваш Telegram ID и выбранные товары. Рассылки пока не подключены. Самовывоз в Хиккадуве.</small></p><button class="primary" style="width:100%" '+(!auth||!data.accepting||pending?'disabled':'')+' onclick="submit()">Отправить заявку</button><p><small>'+(!auth?'Откройте приложение через Telegram для отправки.':'Оплата не производится.')+'</small></p></div>'}
function orders(){return '<h2>Мои заявки</h2>'+(!auth?'<p>Откройте через Telegram.</p>':history.map(o=>'<div class="panel" style="margin:8px 0"><b>№'+esc(o.id.slice(0,8))+'</b><p>'+({'interest':'Сбор интереса','requested':'Заявка получена','cancelled':'Отменена'}[o.status]||esc(o.status))+'</p>'+o.items.map(p=>'<div class="row"><span>'+esc(p.name)+'</span><b>× '+p.qty+'</b></div>').join('')+(o.wish?'<p>'+esc(o.wish)+'</p>':'')+(o.parcel?'<p>Партия №'+o.parcel.id+' · '+esc(({open:'Сбор',closed:'Закрыта',sent:'В пути',arrived:'Прибыла',ready:'Готова к выдаче'})[o.parcel.status]||o.parcel.status)+'</p>'+(o.parcel.track?'<a href="https://www.pochta.ru/tracking?barcode='+encodeURIComponent(o.parcel.track)+'" target="_blank" rel="noopener">Официальный трекинг</a>':'<small>Трек-номер появится после отправки.</small>'):'<small>Вес не резервируется до подтверждения.</small>')+(o.status!=='cancelled'?'<p><button onclick="cancelOrder(\''+esc(o.id)+'\')">Отменить заявку</button></p>':'')+'</div>').join('')||'<p>Заявок пока нет.</p>')}
function crm(){if(!admin)return '<h2>CRM</h2><p>Доступ только для администратора.</p>';const t=admin.totals;return '<h2>Аналитика</h2><div class="panel"><div class="row"><span>Заявки</span><b>'+t.requests+'</b></div><div class="row"><span>Клиенты</span><b>'+t.customers+'</b></div><div class="row"><span>Вес резервов</span><b>'+t.reserved_grams/1000+' кг</b></div><div class="row"><span>Оценка заявок (не выручка)</span><b>'+rub(t.estimated_kopecks)+'</b></div></div><h3 style="margin-top:15px">По источникам</h3><div class="panel">'+admin.sources.map(x=>'<div class="row"><span>'+esc(x.source)+'</span><b>'+x.requests+'</b></div>').join('')+'</div><h3 style="margin-top:15px">Спрос по товарам</h3><div class="panel">'+admin.products.map(x=>'<div class="row"><span>'+esc(x.name)+'</span><b>'+x.quantity+'</b></div>').join('')+'</div><h3 style="margin-top:15px">Посылки</h3><div class="panel">'+admin.parcels.map(p=>'<div class="row"><span>№'+p.id+' · '+esc(p.status)+'</span><b>'+p.reserved/1000+' / '+p.capacity/1000+' кг</b></div>').join('')+'</div>'}
function render(){if(!data)return;$('nav').innerHTML=[['catalog','Каталог'],['cart','Заявка · '+Object.values(cart).reduce((a,b)=>a+b,0)],['orders','Мои заявки'],...(admin?[['admin','CRM']]:[])].map(([k,t])=>'<button '+(page===k?'aria-current="page"':'')+' onclick="go(\''+k+'\')">'+t+'</button>').join('');$('app').innerHTML='<div class="section">'+({catalog,cart:checkout,orders,admin:crm}[page]())+'</div>';if(page==='catalog')drawProducts()}
async function go(p){page=p;feedback('');render();try{if(p==='orders'&&auth){history=await api('/api/orders');if(page===p)render()}if(p==='admin'&&admin){admin=await api('/api/admin/summary');if(page===p)render()}}catch(e){feedback(e.message)}}
async function submit(){if(pending||!auth||!data.accepting)return;pending=true;requestId??=crypto.randomUUID();render();try{await api('/api/orders',{request_id:requestId,items:cart,wish,notify,allow_next:allowNext});cart={};wish='';notify=false;allowNext=false;resetKey();await go('orders');feedback('Заявка сохранена.');data=await api('/api/catalog');render()}catch(e){feedback(e.message)}finally{pending=false;render()}}
async function cancelOrder(id){if(!confirm('Отменить эту заявку?'))return;try{await api('/api/cancel',{id});data=await api('/api/catalog');await go('orders')}catch(e){feedback(e.message)}}
(async()=>{try{data=await api('/api/catalog');render();if(auth){try{admin=await api('/api/admin/summary');render()}catch{}}}catch(e){$('app').textContent='Не удалось загрузить каталог. Обновите страницу.'}})();
</script></body></html>
