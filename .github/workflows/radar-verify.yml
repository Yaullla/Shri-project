name: Radar verification
on:
  push:
    branches: ['feat/radar-mcp-core', 'feat/price-collector', 'feat/buyer-workspace', 'main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --python 3.13
      - run: uv run pytest -q
      - run: uv run python scripts/mcp_smoke.py
      - run: uv run ruff check radar tests scripts
  network-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --python 3.13
      - name: Collect public price candidates
        shell: bash
        env:
          RADAR_DB: ${{ runner.temp }}/radar-observations.sqlite3
        run: |
          set -o pipefail
          uv run python -m scripts.collect_prices citywatch-ae watchhouse-ae timeteam-ru pi-in amazon-in --fx | tee "${RUNNER_TEMP}/radar-probe.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: radar-public-price-probe
          path: |
            ${{ runner.temp }}/radar-probe.jsonl
            ${{ runner.temp }}/radar-observations.sqlite3
          retention-days: 7
          if-no-files-found: warn
  optimizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [rtk, serena, context-mode]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
      - name: Install and smoke-test isolated tool
        run: bash scripts/verify_optimizer.sh "${{ matrix.tool }}"
