name: Parcel store verification
on:
  push:
    branches: [feat/parcel-store]
    paths: ['parcel-store/**', '.github/workflows/parcel-store-verify.yml']
  pull_request:
    paths: ['parcel-store/**', '.github/workflows/parcel-store-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: parcel-store
    steps:
      - uses: actions/checkout@v4
      - name: Python offline regression tests
        run: |
          python3 -m unittest -v test_pilot test_tracking
          python3 -m py_compile pilot_api.py bot.py manage_pilot.py
      - name: Marketing permission and duplicate tests (offline)
        run: cd marketing && python3 -m unittest -v test_publisher test_scheduler && python3 publisher.py && node configure-profile.mjs
      - name: Node smoke tests
        run: node --test test_motion.mjs
      - name: Verify static preview file allowlist
        run: |
          node build-preview.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("dist")
          actual={str(x.relative_to(root)) for x in root.rglob("*") if x.is_file()}
          assert actual=={"index.html","robots.txt","vendor/anime-4.5.0.min.js","vendor/anime-LICENSE.md","marketing.html","marketing/communities.json","marketing/campaign-new-year.txt"},actual
          groups=json.loads((root/"marketing/communities.json").read_text())["communities"]
          assert len(groups)==30 and all(not g["auto_publish"] and not g["free_confirmed"] for g in groups)
          assert "marketing.html" in (root/"index.html").read_text()
          PY
      - name: Install pinned browser test dependency
        run: |
          python3 -m pip install playwright==1.65.2
          python3 -m playwright install --with-deps chromium
      - name: Real browser checks
        run: python3 -m unittest -v test_browser
      - name: Verify deployment image builds
        run: docker build -t samobranka-pilot:test .
