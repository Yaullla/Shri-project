<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar | Workspace</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182332;font:15px/1.5 "Segoe UI",Arial,sans-serif}nav{background:#111d2d;padding:18px max(20px,calc((100vw - 1180px)/2));display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:white}nav a{color:#b0f3e5;text-decoration:none}main{max-width:1180px;margin:auto;padding:28px 20px}h1{font-size:32px;letter-spacing:-1px;margin:0}p{color:#68778c}section{background:white;border:1px solid #e4e9ef;border-radius:12px;padding:20px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{padding:16px;border:1px solid #e4e9ef;border-radius:8px}.stat strong{display:block;font-size:28px;color:#087e73}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:end}label{display:grid;gap:4px;font-size:13px;color:#526476}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd5df;border-radius:7px;min-width:0}button{cursor:pointer;background:#087e73;color:white;border:0}button.secondary{background:#e8eef3;color:#233044}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e4e9ef;padding:10px;text-align:left;vertical-align:top}td button{margin:2px;font-size:12px}.scroll{overflow:auto}a{color:#087e73}#message{min-height:24px;color:#a23f36}small{color:#68778c}</style></head><body>
<nav><strong>◉ RADAR</strong><a href="/">Покупатель</a><a href="/travel">Путешественник</a><a href="/admin">Администратор</a></nav><main><small>LOCAL WORKSPACE · 0.5</small><h1 id="title"></h1><p id="intro"></p><div class="stats" id="stats"></div><section><h2 id="formtitle">Добавить запись</h2><form id="form"></form><div id="message" role="status"></div></section><section><h2>Записи</h2><label>Поиск<input id="filter" placeholder="Название, маршрут, страна"></label><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section><small>Локальная среда разработки. Нет разграничения аккаунтов, платежей или подтверждённых заказов. Не публиковать в интернете.</small></main>
<script>
const travel=location.pathname==='/travel', endpoint='/api/'+(travel?'trips':'communities'), el=id=>document.getElementById(id);
const statuses={new:'Новый',contacted:'Связались',permission_granted:'Разрешено',declined:'Отказ'};
const fields=travel?[['origin','Откуда'],['destination','Куда'],['departure','Дата','date'],['capacity_kg','Свободный вес, кг','number'],['reward_rub','Вознаграждение, ₽','number']]:[['name','Название'],['url','Публичная ссылка Telegram','url'],['country','Страна'],['routes','Маршруты'],['audience','Аудитория'],['rules','Правила публикации'],['contact_status','Статус контакта','select'],['ad_cost_rub','Реклама, ₽ (неизвестно — пусто)','number'],['leads','Входящие заявки','number']];
el('title').textContent=travel?'Маршруты и поездки':'CRM Telegram-сообществ';el('intro').textContent=travel?'Локальный реестр маршрутов. Только разрешённые товары и перевозки; без бронирования.':'Контакты с администрацией, правила размещения и входящие заявки. Без автоматических рассылок.';
let rows=[],editing=null;
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
for(const [key,label,type] of fields){const l=node('label',label),i=node(type==='select'?'select':'input');i.name=key;if(type==='select'){for(const [v,t] of Object.entries(statuses)){const o=node('option',t);o.value=v;i.append(o)}}else{i.type=type||'text';if(type==='number'){i.min=key==='capacity_kg'?'0.1':'0';i.step=key==='capacity_kg'?'0.1':'1'}if(['name','url','country','origin','destination','departure','capacity_kg','reward_rub'].includes(key))i.required=true;}l.append(i);el('form').append(l)}
const save=node('button','Сохранить');save.type='submit';el('form').append(save);const cancel=node('button','Отмена');cancel.type='button';cancel.className='secondary';cancel.onclick=reset;el('form').append(cancel);
function reset(){editing=null;el('form').reset();el('formtitle').textContent='Добавить запись'}
async function api(path='',options={}){const r=await fetch(endpoint+path,options);if(!r.ok)throw Error('Ошибка HTTP '+r.status);return r.json()}
function render(){const q=el('filter').value.toLowerCase();el('body').replaceChildren();el('head').replaceChildren();const tr=node('tr');for(const [,title] of fields)tr.append(node('th',title));tr.append(node('th','Действия'));el('head').append(tr);
for(const row of rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q))){const tr=node('tr');for(const [key] of fields){const td=node('td',key==='contact_status'?statuses[row[key]]:String(row[key]??'—'));if(key==='url'){const a=node('a',row[key]);a.href=row[key];a.target='_blank';a.rel='noopener noreferrer';td.replaceChildren(a)}tr.append(td)}const td=node('td');if(!travel){const b=node('button','Изменить');b.className='secondary';b.onclick=()=>{editing=row.id;for(const [k] of fields)el('form').elements[k].value=row[k]??'';el('formtitle').textContent='Редактировать запись';el('form').scrollIntoView({behavior:'smooth'})};td.append(b)}const d=node('button','Удалить');d.className='secondary';d.onclick=async()=>{if(confirm('Удалить запись?'))try{await api('/'+row.id,{method:'DELETE'});reset();await load()}catch(e){el('message').textContent=e.message}};td.append(d);tr.append(td);el('body').append(tr)}
if(!el('body').children.length){const t=node('td','Нет записей');t.colSpan=fields.length+1;const tr=node('tr');tr.append(t);el('body').append(tr)}
const metrics=travel?[['Поездки',rows.length],['Доступно кг',rows.reduce((s,r)=>s+r.capacity_kg,0).toFixed(1)]]:[['Сообщества',rows.length],['Разрешение',rows.filter(r=>r.contact_status==='permission_granted').length],['Заявки',rows.reduce((s,r)=>s+r.leads,0)],['Известная стоимость рекламы, ₽',rows.reduce((s,r)=>s+(r.ad_cost_rub??0),0)]];
el('stats').replaceChildren(...metrics.map(([k,v])=>{const n=node('div',k);n.className='stat';n.append(node('strong',String(v)));return n}))}
async function load(){try{rows=(await api()).rows;render();el('message').textContent=''}catch(e){el('message').textContent=e.message}}
el('form').onsubmit=async e=>{e.preventDefault();const data={};for(const [k,,t] of fields){const v=el('form').elements[k].value;data[k]=t==='number'?(v===''?(k==='ad_cost_rub'?null:0):Number(v)):v}try{await api(editing?'/'+editing:'',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});reset();await load()}catch(e){el('message').textContent=e.message}};el('filter').oninput=render;load();
</script></body></html>
