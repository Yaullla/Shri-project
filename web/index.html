 if(page==='finance'){const rev=state.sales.reduce((s,x)=>s+x.sale,0),profit=state.sales.reduce((s,x)=>s+x.sale-x.cost-x.fee,0);h=hero('Мои финансы','Локальный журнал — не бухгалтерская система')+'<div class="tiles">'+tile('Выручка',rub(rev),'Введено пользователем')+tile('Прибыль',rub(profit),'После указанных затрат')+tile('Маржа',rev?pc(profit/rev*100):'—','Доля выручки')+tile('Продажи',state.sales.length,'Записи журнала')+'</div><section class="panel"><h2>Добавить продажу</h2><form id="saleForm" class="formgrid"><label class="wide">Название<input name="name" required maxlength="120"></label><label>Выручка ₽<input name="sale" type="number" min="1" required></label><label>Себестоимость ₽<input name="cost" type="number" min="0" required></label><label>Комиссии ₽<input name="fee" type="number" min="0" required value="0"></label><button class="btn primary" type="submit">Добавить</button></form></section><section class="panel"><h2>Журнал продаж</h2><div class="scroll"><table><thead><tr><th>Товар</th><th>Выручка</th><th>Прибыль</th><th></th></tr></thead><tbody>'+state.sales.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+rub(x.sale)+'</td><td>'+rub(x.sale-x.cost-x.fee)+'</td><td><button class="btn small" data-delete-sale="'+x.id+'">Удалить</button></td></tr>').join('')+'</tbody></table></div></section>'}
 if(page==='rewards'){h=hero('Radar Rewards','Предлагаемая программа лояльности · не начисляет реальные баллы')+'<div class="tiles">'+tile('Silver','1×','Базовый')+tile('Gold','1.2×','3 месяца или 5 заказов')+tile('Platinum','1.5×','10 заказов')+tile('Diamond','2×','25 заказов')+'</div><div class="split"><section class="panel"><h2>Реферальный калькулятор</h2><div class="formgrid"><label>Платящих приглашённых<input id="refs" type="number" min="0" value="20"></label><label>Комиссия, %<input id="refpct" type="number" min="0" max="100" value="15"></label></div><p>Сценарий: подписка 500 ₽/мес.</p><div id="rewardResult" class="result"></div></section><section class="panel"><h2>Black Diamond</h2><p>50 заказов · множитель 2,5× · условия предварительные.</p><p>Вознаграждение только за реальные оплаченные подписки.</p></section></div>'}
 if(page==='admin'){h=hero('Диагностика источников','Архив технических проверок 26.11.2026')+'<div class="tiles">'+tile('MCP','7','Инструментов проверено в CI')+tile('Тесты','25/25','Архив успешного прогона')+tile('Источники цен','2','Последний успешный тест')+tile('Запуск','CI','Не постоянный сервер')+'</div><section class="panel"><h2>Состояние источников</h2>'+diagnostics.map(a=>'<div class="statline"><div><strong>'+esc(a[0])+'</strong><small>'+esc(a[1])+'</small></div>'+badge(a[2],a[3])+'</div>').join('')+'<p><a href="'+capture+'" target="_blank" rel="noopener">Первичный журнал ↗</a> · <a href="https://github.com/Yaullla/Shri-project" target="_blank" rel="noopener">GitHub ↗</a></p></section>'}
 $('view').innerHTML=h;
 if(page==='market'){marketRows();$('q').oninput=e=>{query=e.target.value;marketRows()};$('region').onchange=e=>{region=e.target.value;marketRows()};if($('minMargin'))$('minMargin').oninput=e=>{minMargin=Number(e.target.value);marketRows()}}
 if(page==='calculator'){document.querySelectorAll('.ci').forEach(x=>x.oninput=calcUpdate);calcUpdate()}
 if(page==='calendar'){drawCalendar();$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('ics').onclick=exportCalendar}
 if(page==='finance')$('saleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.sales.push({id:Date.now(),name:f.get('name'),sale:Number(f.get('sale')),cost:Number(f.get('cost')),fee:Number(f.get('fee'))});save();render()}
 if(page==='rewards'){let update=()=>{$('rewardResult').textContent=rub(Math.max(0,+$('refs').value)*500*Math.max(0,Math.min(100,+$('refpct').value))/100)+'/мес.'};$('refs').oninput=update;$('refpct').oninput=update;update()}
}
function marketRows(){const q=query.toLowerCase();if(marketMode==='observed'){const rows=safeRows().filter(o=>(title(o.product_key)+' '+o.source+' '+o.product_key).toLowerCase().includes(q)&&(region==='all'||o.region===region));$('marketRows').innerHTML=rows.length?obsTable(rows):'<div class="empty">Наблюдений по фильтру нет.</div>'}else{const ds=demos.filter(d=>(d.name+' '+d.sku).toLowerCase().includes(q)&&(region==='all'||d.region===region)&&scenario(d).margin_percent>=minMargin);$('marketRows').innerHTML='<div class="scenario-banner">Сценарные закупочные цены и расходы придуманы для теста интерфейса. Не реальные офферы.</div>'+(ds.length?demoTable(ds):'<div class="empty">Нет сценариев с такими параметрами.</div>')}}
async function calcUpdate(){const seq=++calcSeq;let v=Object.fromEntries(['buy','market','ship','customs','other','fee','discount'].map(k=>[k,Number($(k).value)]));if(!Object.values(v).every(x=>Number.isFinite(x)&&x>=0)||v.market<=0||v.discount>5||v.fee>=100){$('calcResult').innerHTML='<p class="negative">Проверьте значения: цена положительная, скидка 0–5%, комиссии менее 100%.</p>';return}let sale=v.market*(1-v.discount/100),r=calc(v.buy,sale,v.ship,v.customs,v.other,v.fee),engine='Локальный расчёт';if(api)try{let response=await fetch('/api/calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purchase_rub:v.buy,sale_rub:sale,shipping_rub:v.ship,customs_rub:v.customs,other_cost_rub:v.other,fee_percent:v.fee})});if(response.ok){r=await response.json();engine='Расчёт FastAPI'}}catch{}if(seq!==calcSeq||!$('calcResult'))return;$('calcResult').innerHTML='<p>Потенциальная прибыль</p><div class="result '+(r.profit_rub>=0?'positive':'negative')+'">'+rub(r.profit_rub)+'</div>'+[['Цена продажи',rub(sale)],['Полная себестоимость',rub(r.landed_rub)],['Комиссии',rub(r.fees_rub)],['Маржа',pc(r.margin_percent)],['Безубыточная цена',rub(r.break_even_rub)]].map(a=>'<div class="statline"><span>'+a[0]+'</span><strong>'+a[1]+'</strong></div>').join('')+'<p>'+engine+'</p>'}
const iso=d=>year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
function drawCalendar(){let start=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();$('month').textContent=new Date(year,month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});$('calendar').innerHTML=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>'<div class="weekday">'+d+'</div>').join('')+'<div></div>'.repeat(start)+Array.from({length:days},(_,i)=>{let d=i+1,n=events.filter(e=>e.start<=iso(d)&&e.end>=iso(d)).length;return '<button class="day '+(d===selected?'selected':'')+'" data-day="'+d+'">'+d+'<span>'+'<i class="dot"></i>'.repeat(n)+'</span></button>'}).join('');$('dateTitle').textContent=iso(selected);$('events').innerHTML=eventList(events.filter(e=>e.start<=iso(selected)&&e.end>=iso(selected)))||'<div class="empty">На этот день событий нет.</div>'}
function shift(n){let d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();selected=1;drawCalendar()}
function exportCalendar(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Radar//Calendar Preview//RU'];for(const e of events){let next=new Date(e.end+'T00:00:00Z');next.setUTCDate(next.getUTCDate()+1);lines.push('BEGIN:VEVENT','UID:'+e.start+'-'+events.indexOf(e)+'@radar.local','DTSTAMP:20261126T000000Z','DTSTART;VALUE=DATE:'+e.start.replaceAll('-',''),'DTEND;VALUE=DATE:'+next.toISOString().slice(0,10).replaceAll('-',''),'SUMMARY:'+e.name,'DESCRIPTION:'+e.status,'URL:'+e.url,'END:VEVENT')}lines.push('END:VCALENDAR');let u=URL.createObjectURL(new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='Radar_Calendar_Preview.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function reserve(id){let d=demos.find(x=>x.id===id),dialog=$('dialog');dialog.innerHTML='<h2>'+esc(d.name)+'</h2><p>Демонстрационная заявка. Товар не резервируется и деньги не списываются.</p><label>Дней до отправки<input id="days" type="number" min="0" max="90" value="14"></label><div id="bookingFee" class="result"></div><div class="dialogactions"><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="confirm">Создать заявку</button></div>';let fee=()=>{let n=Math.max(0,Math.min(90,+$('days').value));return Math.round(d.buy*(n>=14?.03:n>=7?.05:n>=3?.07:n>=1?.1:.12))};let upd=()=>{$('bookingFee').textContent=rub(fee())+' сбор'};$('days').oninput=upd;upd();$('cancel').onclick=()=>dialog.close();$('confirm').onclick=()=>{state.orders.push({id:Date.now(),name:d.name,days:Math.max(0,Math.min(90,+$('days').value)),fee:fee()});save();dialog.close();page='orders';render()};dialog.showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page){page=d.page;render()}if(d.mode){marketMode=d.mode;query='';region='all';render()}if(d.save){state.saved=state.saved.includes(d.save)?state.saved.filter(x=>x!==d.save):[...state.saved,d.save];save();render()}if(d.reserve)reserve(d.reserve);if(d.day){selected=+d.day;drawCalendar()}if(d.deleteOrder){state.orders=state.orders.filter(x=>x.id!==+d.deleteOrder);save();render()}if(d.deleteSale){state.sales=state.sales.filter(x=>x.id!==+d.deleteSale);save();render()}});
render();
if(location.protocol.startsWith('http'))fetch('/api/observations').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{api=true;$('apiState').textContent='FastAPI подключён · '+(data.rows.length?'локальная база':'архивный резерв');if(data.rows.length){observations=data.rows;mode='database'}render()}).catch(()=>{$('apiState').textContent='Автономный режим · архив'});
</script></body></html>
